
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etalase — Katalog Produk</title>
  <link rel="stylesheet" href="css/index.css">
  <script src="js/index.js" defer></script>
</head>
<body>
  <nav>
    <a href="index.html" aria-current="page">Etalase</a>
    <a href="form.html">Caption</a>
  </nav>

  <header>
    <div class="eyebrow">Rak No. 01 — Toko Digital</div>
    <h1>Etalase</h1>
    <p>Data produk ditarik langsung dari dummyjson.com/products</p>
  </header>

  <div class="controls">
    <input
      type="search"
      id="searchInput"
      placeholder="Cari produk..."

  <main>

  </main>

  <footer>
    Sumber data: dummyjson.com · Dibuat dengan HTML + JS native
